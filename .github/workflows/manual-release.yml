name: Publish release

# Builds the terminal-only magpie for every platform (make release-cli) and
# publishes the binaries to a GitHub Release in this repo. No tags or
# secrets needed up front — the tag is created with the release.
#
# Triggers: every push to any branch (defaults to the upstream's latest
# tag plus a "-patch" suffix, overwriting that release), or hand-run from
# Actions with an explicit version.
#
# The v* tag flow in release.yml stays upstream-only: it dispatches to
# yetone/magpie-releases, whose signing secrets live only there.

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0 or v0.1.0; empty = upstream latest tag plus -patch)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean
      overwrite:
        description: 'Delete an existing release/tag with this version first (for re-runs)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          if [[ -z "$V" ]]; then
            # Push runs carry no input: take the upstream's latest tag and
            # release it here with a -patch suffix. The tags API answers
            # newest first but isn't strictly ordered, so the highest
            # version wins. Falls back to this repo's latest release, then
            # to bootstrapping 0.1.0, when upstream can't be read.
            TAGS="$(gh api 'repos/yetone/magpie/tags?per_page=100' --jq '.[].name' 2>/dev/null || true)"
            V="$(printf '%s' "$TAGS" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)"
            if [[ -n "$V" ]]; then
              V="$V-patch"
              echo "Upstream latest tag plus -patch: v$V"
            else
              RAW="$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
              V="$(printf '%s' "$RAW" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
              if [[ -z "$V" ]]; then
                V="0.1.0"
                echo "No releases yet — bootstrapping first version: v$V"
              else
                echo "Reusing latest release version: v$V"
              fi
            fi
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-patch)?$ ]]; then
            echo "::error::version must look like 0.1.0 (got '$V')"
            exit 1
          fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Delete existing release and tag
        # inputs.* defaults only apply to hand runs; on push the context is
        # empty, so push runs (which always republish) must match too.
        if: github.event_name == 'push' || inputs.overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" --cleanup-tag -y || true

      - name: Build CLI binaries
        run: make release-cli VERSION=${{ steps.version.outputs.tag }}

      - name: Checksums
        run: |
          (cd dist && sha256sum magpie-cli-* > SHA256SUMS.txt)
          ls -la dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then FLAGS+=(--prerelease); fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            "${FLAGS[@]}" \
            dist/magpie-cli-* dist/SHA256SUMS.txt
